<header class="hdr" [class.menu-open]="menuOpen()">
  <a routerLink="/" class="brand" (click)="closeMenu()">
    <span class="mark" aria-hidden="true">iS</span>
    <span class="name">infopoint <strong>Sardegna</strong></span>
  </a>

  <nav class="nav" id="main-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Dashboard
    </a>
    <a routerLink="/meteo" routerLinkActive="active">Meteo</a>
    <a routerLink="/incendi" routerLinkActive="active">Incendi</a>
    <a routerLink="/traffico" routerLinkActive="active">Traffico</a>
    <a routerLink="/voli" routerLinkActive="active">Voli</a>
    <a routerLink="/navi" routerLinkActive="active">Navi e mare</a>
    <a routerLink="/carburante" routerLinkActive="active">Carburante</a>
    <a routerLink="/fiumi" routerLinkActive="active">Fiumi</a>
    <a routerLink="/luoghi" routerLinkActive="active">Luoghi</a>
    <a routerLink="/news" routerLinkActive="active">News</a>
    <a routerLink="/eventi" routerLinkActive="active">Eventi</a>
    @if (session.isAuthenticated()) {
      <a routerLink="/gestione" routerLinkActive="active">Gestione</a>
      <a routerLink="/impostazioni" routerLinkActive="active">Impostazioni</a>
    }
  </nav>

  <div class="actions">
    <button
      class="hamburger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      aria-label="Menu sezioni"
    >
      @if (menuOpen()) {
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      } @else {
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      }
    </button>

    @if (session.isAuthenticated()) {
      <span class="muted who">{{ session.user()?.nome }}</span>
      <button class="btn btn-ghost" type="button" (click)="logout()">Esci</button>
    } @else {
      <a routerLink="/login" class="btn btn-primary" (click)="closeMenu()">Accedi</a>
    }
  </div>
</header>
